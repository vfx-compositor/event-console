<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Event Console 사진 오버레이 대기 화면</title>
  <desc id="desc">투명 배경 위에 행사 시작 대기 문구를 표시합니다</desc>
  <rect x="96" y="700" width="1728" height="260" fill="#0b1220" fill-opacity="0.82"/>
  <rect x="96" y="700" width="12" height="260" fill="#d9b65d"/>
  <text x="154" y="776" fill="#d9b65d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="0">Event Console</text>
  <text x="154" y="858" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="800" letter-spacing="0">행사 시작을 기다리고 있습니다</text>
  <text x="154" y="916" fill="#c7cfdb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" letter-spacing="0">진행자의 안내를 기다려 주세요</text>
</svg>
